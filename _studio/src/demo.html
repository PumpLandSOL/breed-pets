<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="_vbase.css">
<style>
#stage{position:absolute;left:50px;top:30px;width:1180px;height:590px;overflow:hidden;border-radius:18px;border:2px solid rgba(255,110,169,.4);box-shadow:0 8px 0 rgba(42,35,32,.08);background:#fdf6e9}
#stage img{position:absolute;left:0;top:0;width:1180px;height:705px;transform-origin:0 0}
#cap{position:absolute;left:50px;right:50px;top:642px;display:flex;align-items:baseline;gap:18px}
#n{font-family:'Press Start 2P';font-size:12px;color:#ff6ea9;white-space:nowrap}#ct{font-size:26px;font-weight:700}
#prog{position:absolute;left:0;bottom:0;height:5px;background:linear-gradient(90deg,#ff6ea9,#28c48a)}
.full{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:#fdf6e9}
</style><body><div class="bgp"></div>
<div id="stage"></div><div id="cap"><span id="n"></span><span id="ct"></span></div><div id="prog"></div>
<div class="full" id="intro"><div><div class="pix" style="font-size:72px">BR<span class="p">EED</span></div><div class="pix" style="margin-top:26px;font-size:16px;color:#6f6355">PRODUCT WALKTHROUGH · ROBINHOOD CHAIN</div></div></div>
<div class="full" id="outro"><div><div style="font-size:44px;font-weight:900">Hatch it. Feed it. <span class="p">Breed it.</span> <span class="m">It trades.</span></div><div style="font-family:'JetBrains Mono';font-size:24px;color:#6f6355;margin-top:24px">@BreedOnRH</div></div></div>
<script>
const $=(i)=>document.getElementById(i),cl=(x)=>Math.max(0,Math.min(1,x)),e=(x)=>{x=cl(x);return x*x*(3-2*x)};
const S=[[1.6,'01-landing','An exchange where every trader is a pet you raise',[1,.5,.4]],
[4,'03-hatch','Hatch one: pick a species, name it, crack the egg',[1.45,.75,.25]],
[7,'02-feed','It posts every take and trades 22 tokenized stocks on the live tape',[1.35,.38,.4]],
[10.4,'05-profile','Feed it, train it. Mood, energy and obedience change how it trades',[1.3,.6,.42]],
[13.6,'04-mine','Whisper it an order. It obeys as often as it respects you',[1.35,.38,.45]],
[16.6,'06-docs','Every rule is public, every call scored against the tape',[1.2,.4,.35]],[19.4]];
const END=19.4,DUR=21.5;
S.slice(0,-1).forEach((s,i)=>{const im=new Image();im.src='../shots/'+s[1]+'.png';im.id='i'+i;$('stage').appendChild(im);});
const tf=(z,p)=>{const s=1+(z[0]-1)*p;const fx=z[1]*1180,fy=z[2]*705;let x=590-fx*s,y=295-fy*s;x=Math.min(0,Math.max(1180-1180*s,x));y=Math.min(0,Math.max(590-705*s,y));return `translate(${x}px,${y}px) scale(${s})`;};
window.__seek=(t)=>{
  $('intro').style.opacity=1-e((t-1.2)/.4);$('outro').style.opacity=e((t-END)/.4);$('prog').style.width=(t/DUR*1280)+'px';
  let k=0;for(let i=0;i<S.length-1;i++)if(t>=S[i][0])k=i;
  S.slice(0,-1).forEach((s,i)=>{const im=$('i'+i);im.style.opacity=i<=k?e((t-s[0])/.35):0;im.style.zIndex=i;const len=S[i+1][0]-s[0];im.style.transform=tf(s[3],e((t-s[0]-.15)/(len*.6)));});
  $('n').textContent=String(k+1).padStart(2,'0')+' / 06';$('ct').textContent=S[k][2];$('cap').style.opacity=e((t-S[k][0])/.3)*(t<END?1:0);
};window.__ready=Promise.all([...document.images].map((i)=>i.decode().catch(()=>0)));window.__seek(0);
</script>
